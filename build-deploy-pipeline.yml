# =============================================================================
# onecrate-ui — build and deploy to Azure Container Apps
# =============================================================================
# ONE deployment, to production. There is no dev deployment of the UI: the
# PROD/DEV switch in the rail is a view toggle over which dataset you are
# looking at, not a deployment boundary.
#
# trigger: none, so running this pipeline is itself the deliberate act of
# deploying to production. That is why there is no separate approval gate — a
# manual gate on a manually-started pipeline is a second click, not a second
# opinion.
#
# Requires, in Azure DevOps:
#   - Service connection 'ACR-TradingShared'        (Docker registry)
#   - Service connection 'Azure-ServiceConnection'  (ARM)
#   - Variable group 'onecrate-ui-variables', supplying BETTER_AUTH_SECRET and
#     AUTH_DB_PASSWORD as *secret* variables.
# =============================================================================

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Supplies BETTER_AUTH_SECRET and AUTH_DB_PASSWORD. Without a group, an
  # undefined $(VAR) macro survives into the script unsubstituted — and where it
  # is single-quoted it reaches Bicep as the literal string "$(VAR)" with no
  # error, so a deploy can "succeed" with garbage parameter values. The guards in
  # the deploy step exist because of that failure mode.
  - group: onecrate-ui-variables
  - name: imageName
    value: 'onecrate-ui'
  # One shared registry for both the executors and this app. The 'dev' in the
  # name is historical — the promote pipeline pulls prod images from here too,
  # which is what the 'ACR-TradingShared' service connection refers to.
  - name: acrName
    value: 'tradingacrdev'
  - name: acrLoginServer
    value: 'tradingacrdev.azurecr.io'
  - name: resourceGroup
    value: 'trading-prod'
  - name: appName
    value: 'onecrate-ui'

stages:
  # ---------------------------------------------------------------------------
  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: ValidateJob
        steps:
          - task: NodeTool@0
            displayName: 'Use Node 22'
            inputs:
              # Next 16 requires >= 20.9; the Dockerfile builds on 22, so CI
              # type-checks against the same major it ships on.
              versionSpec: '22.x'

          - script: npm ci
            displayName: 'npm ci'

          - script: npm run lint
            displayName: 'Lint'

          - script: npx tsc --noEmit -p tsconfig.json
            displayName: 'Typecheck'

          # Compiles the template and the parameter file. Catches a malformed
          # resource or a param the template does not declare here, in seconds,
          # rather than half a Docker build later.
          - task: AzureCLI@2
            displayName: 'Compile Bicep'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az bicep install
                az bicep build --file infrastructure/ui.bicep --stdout > /dev/null
                az bicep build-params --file infrastructure/ui.bicepparam --stdout > /dev/null
                echo "✓ Bicep compiles"

  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: 'Build and push image'
    dependsOn: Validate
    jobs:
      - job: BuildJob
        steps:
          - task: Docker@2
            displayName: 'Build image'
            inputs:
              containerRegistry: 'ACR-TradingShared'
              command: 'build'
              repository: '$(imageName)'
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push to ACR'
            inputs:
              containerRegistry: 'ACR-TradingShared'
              command: 'push'
              repository: '$(imageName)'
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              echo "=========================================="
              echo "Image pushed: $(acrLoginServer)/$(imageName):$(Build.BuildId)"
              echo "=========================================="
            displayName: 'Print image tag'

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    jobs:
      - job: DeployJob
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy container app'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                # Fail loudly on unset secrets. Bicep would otherwise accept the
                # literal "$(BETTER_AUTH_SECRET)" as the signing key, and the app
                # would come up serving sessions signed with a string from a
                # pipeline template.
                for var in BETTER_AUTH_SECRET AUTH_DB_PASSWORD; do
                  value="${!var:-}"
                  if [ -z "$value" ] || [[ "$value" == '$('* ]]; then
                    echo "##vso[task.logissue type=error]$var is not set in variable group onecrate-ui-variables."
                    exit 1
                  fi
                done

                echo "Container image: $(acrLoginServer)/$(imageName):$(Build.BuildId)"

                ACR_USERNAME=$(az acr credential show --name $(acrName) --query username -o tsv)
                ACR_PASSWORD=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)

                az deployment group create \
                  --resource-group $(resourceGroup) \
                  --template-file $(Build.SourcesDirectory)/infrastructure/ui.bicep \
                  --parameters $(Build.SourcesDirectory)/infrastructure/ui.bicepparam \
                  --parameters containerImage='$(acrLoginServer)/$(imageName):$(Build.BuildId)' \
                  --parameters acrLoginServer='$(acrLoginServer)' \
                  --parameters acrUsername="$ACR_USERNAME" \
                  --parameters acrPassword="$ACR_PASSWORD" \
                  --parameters betterAuthSecret="$BETTER_AUTH_SECRET" \
                  --parameters authDbPassword="$AUTH_DB_PASSWORD" \
                  --name "onecrate-ui-$(Build.BuildId)" \
                  --verbose

                echo "✓ Deployed"
            env:
              # Secret variables are not auto-mapped into the script environment.
              BETTER_AUTH_SECRET: $(BETTER_AUTH_SECRET)
              AUTH_DB_PASSWORD: $(AUTH_DB_PASSWORD)

          - task: AzureCLI@2
            displayName: 'Smoke test and report endpoints'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                FQDN=$(az deployment group show \
                  --resource-group $(resourceGroup) \
                  --name "onecrate-ui-$(Build.BuildId)" \
                  --query properties.outputs.fqdn.value -o tsv)
                STATIC_IP=$(az deployment group show \
                  --resource-group $(resourceGroup) \
                  --name "onecrate-ui-$(Build.BuildId)" \
                  --query properties.outputs.staticIp.value -o tsv)

                # /api/* is excluded from the Proxy matcher, so this is reachable
                # on the Azure FQDN even before the onecrate.io records exist.
                for i in $(seq 1 10); do
                  CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || echo 000)
                  if [ "$CODE" = "200" ]; then
                    echo "✓ /api/health returned 200"
                    break
                  fi
                  if [ "$i" = "10" ]; then
                    echo "##vso[task.logissue type=error]/api/health never returned 200 (last: $CODE)."
                    echo "Most likely: a required env var is missing, so the app refuses to"
                    echo "start (src/instrumentation.ts), or it cannot reach Azure SQL."
                    echo "Check: az containerapp logs show -n $(appName) -g $(resourceGroup) --tail 100"
                    exit 1
                  fi
                  echo "attempt $i: /api/health returned $CODE, retrying..."
                  sleep 10
                done

                BOUND=$(az containerapp show \
                  --resource-group $(resourceGroup) --name $(appName) \
                  --query "properties.configuration.ingress.customDomains[].name" -o tsv || true)

                echo "=========================================="
                echo "App URL      : https://$FQDN"
                echo "Static IP    : $STATIC_IP   (apex A record)"
                echo "Bound domains: ${BOUND:-none yet}"
                echo "=========================================="

                if [ -z "$BOUND" ]; then
                  echo "Custom domains are not bound yet. Create these in Wix, then"
                  echo "uncomment customDomains in infrastructure/ui.bicepparam and re-run:"
                  echo ""
                  echo "  CNAME  www        -> $FQDN"
                  echo "  A      @          -> $STATIC_IP"
                  echo "  TXT    asuid.www  -> <validation token from the portal>"
                  echo "  TXT    asuid      -> <validation token from the portal>"
                  echo ""
                  echo "Until then the app is browsable at https://$FQDN — but signing in"
                  echo "requires the canonical host, since trustedOrigins is pinned to"
                  echo "APP_ORIGIN. Reaching the FQDN proves the container runs and serves."
                fi
